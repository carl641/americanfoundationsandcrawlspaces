<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="American Foundations &amp; Crawlspaces emblem">
  <title>American Foundations &amp; Crawlspaces</title>
  <defs>
    <clipPath id="field"><circle cx="200" cy="200" r="160"/></clipPath>
    <clipPath id="roofLeft"><rect x="0" y="0" width="200" height="400"/></clipPath>
    <clipPath id="roofRight"><rect x="200" y="0" width="200" height="400"/></clipPath>
    <clipPath id="roofShape">
      <polygon points="200,74 332,184 288,184 200,110 112,184 68,184"/>
    </clipPath>
    <g id="star">
      <path d="M0,-9 L2.6,-2.8 L9,-2.8 L3.9,1.3 L5.8,7.9 L0,4 L-5.8,7.9 L-3.9,1.3 L-9,-2.8 L-2.6,-2.8 Z"/>
    </g>
  </defs>

  <!-- Badge rings -->
  <circle cx="200" cy="200" r="191" fill="#ffffff" stroke="#1e3052" stroke-width="14"/>
  <circle cx="200" cy="200" r="171" fill="none" stroke="#953037" stroke-width="8"/>

  <g clip-path="url(#field)">
    <!-- Below-grade soil -->
    <rect x="0" y="230" width="400" height="170" fill="#8b8a8e" opacity="0.28"/>
    <g opacity="0.35" stroke="#8b8a8e" stroke-width="2">
      <path d="M40 252 h320 M40 276 h320 M40 300 h320 M40 324 h320"/>
    </g>

    <!-- Foundation stem wall -->
    <rect x="104" y="230" width="192" height="56" fill="#8b8a8e" stroke="#1e3052" stroke-width="7"/>
    <path d="M136 244 h128 M136 262 h128" stroke="#1e3052" stroke-width="4" opacity="0.45"/>

    <!-- Piers with footings -->
    <g fill="#1e3052">
      <rect x="132" y="286" width="18" height="34"/>
      <rect x="124" y="318" width="34" height="13"/>
      <rect x="191" y="286" width="18" height="34"/>
      <rect x="183" y="318" width="34" height="13"/>
      <rect x="250" y="286" width="18" height="34"/>
      <rect x="242" y="318" width="34" height="13"/>
    </g>

    <!-- Grade line -->
    <path d="M46 230 H354" stroke="#1e3052" stroke-width="6" stroke-linecap="round"/>

    <!-- Above-grade wall -->
    <rect x="118" y="180" width="164" height="50" fill="#ffffff" stroke="#1e3052" stroke-width="7"/>
    <rect x="180" y="192" width="40" height="32" fill="#1e3052"/>
    <path d="M200 192 v32 M180 208 h40" stroke="#ffffff" stroke-width="4"/>

    <!-- Roof: left plane = star field, right plane = stripes -->
    <g clip-path="url(#roofShape)">
      <g clip-path="url(#roofLeft)">
        <rect x="0" y="40" width="200" height="200" fill="#1e3052"/>
        <g fill="#ffffff">
          <use href="#star" x="128" y="164"/>
          <use href="#star" x="157" y="140"/>
          <use href="#star" x="186" y="116"/>
          <use href="#star" x="160" y="176"/>
          <use href="#star" x="189" y="152"/>
        </g>
      </g>
      <g clip-path="url(#roofRight)">
        <rect x="200" y="40" width="200" height="200" fill="#ffffff"/>
        <g fill="#953037">
          <rect x="200" y="96" width="200" height="15"/>
          <rect x="200" y="126" width="200" height="15"/>
          <rect x="200" y="156" width="200" height="15"/>
          <rect x="200" y="186" width="200" height="15"/>
        </g>
      </g>
    </g>
    <polygon points="200,74 332,184 288,184 200,110 112,184 68,184" fill="none" stroke="#1e3052" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
